<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1610" viewBox="0 0 1500 1610"><rect width="1500" height="1610" fill="#f7f6f1"/><text x="60" y="65" font-family="Noto Sans" font-size="34">Tabernacle of Praise / Reading the marks</text><text x="60" y="105" font-family="Noto Sans" font-size="17" fill="#555">DRAFT — NOT FOR PUBLICATION / Visible meaning versus intended association</text><rect x="45" y="150" width="1410" height="450" rx="6" fill="#fff" stroke="#ddd"/><text x="75" y="195" font-family="Noto Sans" font-size="24">B / Sanctuary Strings</text><svg x="120" y="215" width="200" height="200" viewBox="0 0 256 256"><g fill="#111"><path d="M24 20 C70 16 88 72 130 124 C158 158 200 166 214 196 L232 232 H44 V104 C44 78 38 68 24 64 Z"/></g></svg><text x="220" y="440" text-anchor="middle" font-family="Noto Sans" font-size="13" fill="#555">01 / HARP-LIKE OUTLINE</text><text x="420" y="320" text-anchor="middle" font-family="Noto Sans" font-size="26" fill="#777">-</text><svg x="580" y="215" width="200" height="200" viewBox="0 0 256 256"><g fill="#111"><path d="M58 52 C78 106 62 188 84 216 H58 Z"/><path d="M76 66 C102 136 92 188 120 216 H94 Z"/><path d="M104 96 C126 142 184 174 162 202 C156 212 150 216 134 216 C116 194 112 144 104 96 Z"/></g></svg><text x="680" y="440" text-anchor="middle" font-family="Noto Sans" font-size="13" fill="#555">02 / THREE NEGATIVE OPENINGS</text><text x="880" y="320" text-anchor="middle" font-family="Noto Sans" font-size="26" fill="#777">=</text><svg x="1040" y="215" width="200" height="200" viewBox="0 0 256 256"><g fill="#111"><path fill-rule="evenodd" d="M24 20 C70 16 88 72 130 124 C158 158 200 166 214 196 L232 232 H44 V104 C44 78 38 68 24 64 Z M58 52 C78 106 62 188 84 216 H58 Z M76 66 C102 136 92 188 120 216 H94 Z M104 96 C126 142 184 174 162 202 C156 212 150 216 134 216 C116 194 112 144 104 96 Z"/></g></svg><text x="1140" y="440" text-anchor="middle" font-family="Noto Sans" font-size="13" fill="#555">03 / THE COMBINED MARK</text><text x="75" y="490" font-family="Noto Sans" font-size="17" fill="#111">What reads clearly: a harp and musical praise.</text><text x="75" y="522" font-family="Noto Sans" font-size="17" fill="#555">The enclosing curve was intended as shelter. A tabernacle is not yet clear in the drawing.</text><text x="75" y="554" font-family="Noto Sans" font-size="17" fill="#555">The number of openings is a compositional choice, not an approved theological statement.</text><rect x="45" y="630" width="1410" height="450" rx="6" fill="#fff" stroke="#ddd"/><text x="75" y="675" font-family="Noto Sans" font-size="24">C / Praise Ligature</text><svg x="120" y="695" width="200" height="200" viewBox="0 0 256 256"><g fill="#111"><path d="M20 34 H236 C232 46 220 54 204 54 H158 C138 54 126 72 126 94 V222 H80 C92 214 94 204 94 186 V66 H72 C48 66 32 70 28 86 C28 62 24 46 20 34 Z"/></g></svg><text x="220" y="920" text-anchor="middle" font-family="Noto Sans" font-size="13" fill="#555">01 / T — TABERNACLE</text><text x="420" y="800" text-anchor="middle" font-family="Noto Sans" font-size="26" fill="#777">+</text><svg x="580" y="695" width="200" height="200" viewBox="0 0 256 256"><g fill="#111"><path d="M144 70 H168 C210 70 232 92 232 118 C232 148 208 158 184 166 C160 174 146 188 146 204 C146 212 152 218 160 222 H144 Z M160 86 V168 C176 152 194 148 194 118 C194 100 182 86 160 86 Z" fill-rule="evenodd"/></g></svg><text x="680" y="920" text-anchor="middle" font-family="Noto Sans" font-size="13" fill="#555">02 / P — PRAISE</text><text x="880" y="800" text-anchor="middle" font-family="Noto Sans" font-size="26" fill="#777">=</text><svg x="1040" y="695" width="200" height="200" viewBox="0 0 256 256"><g fill="#111"><path d="M20 34 H236 C232 46 220 54 204 54 H158 C138 54 126 72 126 94 V222 H80 C92 214 94 204 94 186 V66 H72 C48 66 32 70 28 86 C28 62 24 46 20 34 Z"/><path d="M144 70 H168 C210 70 232 92 232 118 C232 148 208 158 184 166 C160 174 146 188 146 204 C146 212 152 218 160 222 H144 Z M160 86 V168 C176 152 194 148 194 118 C194 100 182 86 160 86 Z" fill-rule="evenodd"/></g></svg><text x="1140" y="920" text-anchor="middle" font-family="Noto Sans" font-size="13" fill="#555">03 / NESTED T + P</text><text x="75" y="970" font-family="Noto Sans" font-size="17" fill="#111">What reads clearly: the initials of Tabernacle and Praise.</text><text x="75" y="1002" font-family="Noto Sans" font-size="17" fill="#555">The broad T and open P were intended to feel spacious. Sanctuary and worship are indirect associations.</text><text x="75" y="1034" font-family="Noto Sans" font-size="17" fill="#555">The narrow white channel separates the letters; it is a functional detail, not a hidden religious symbol.</text><rect x="45" y="1110" width="1410" height="450" rx="6" fill="#fff" stroke="#ddd"/><text x="75" y="1155" font-family="Noto Sans" font-size="24">D / Resonant Sanctuary — new proposal</text><svg x="120" y="1175" width="200" height="200" viewBox="0 0 256 256"><g fill="#111"><g transform="translate(-7 0)"><path d="M48 212 C38 226 44 236 60 236 H170 C204 236 220 218 220 184 V156 C209 162 193 167 184 175 C177 182 178 188 176 194 C174 201 170 204 164 204 H72 C60 204 54 208 48 212 Z"/><path d="M32 92 C24 98 24 106 24 120 V202 C24 216 30 226 40 232 C34 218 50 204 60 196 V120 C60 108 50 100 42 96 C38 94 34 92 32 92 Z"/><path d="M24 84 C28 68 42 56 60 56 H152 C172 56 184 68 184 84 V92 H92 C72 92 56 78 40 78 C34 78 28 80 24 84 Z"/></g></g></svg><text x="220" y="1400" text-anchor="middle" font-family="Noto Sans" font-size="13" fill="#555">01 / ENCLOSING FOLDS</text><text x="420" y="1280" text-anchor="middle" font-family="Noto Sans" font-size="26" fill="#777">+</text><svg x="580" y="1175" width="200" height="200" viewBox="0 0 256 256"><g fill="#111"><g transform="translate(-7 0)"><path d="M190 86 V62 C190 44 218 36 234 20 V46 C234 64 202 66 190 86 Z"/><path d="M188 122 V102 C188 84 218 78 246 52 V80 C246 98 202 102 188 122 Z"/><path d="M192 160 V142 C192 122 222 116 232 104 V128 C232 144 200 144 192 160 Z"/></g></g></svg><text x="680" y="1400" text-anchor="middle" font-family="Noto Sans" font-size="13" fill="#555">02 / RISING RHYTHM</text><text x="880" y="1280" text-anchor="middle" font-family="Noto Sans" font-size="26" fill="#777">=</text><svg x="1040" y="1175" width="200" height="200" viewBox="0 0 256 256"><g fill="#111"><g transform="translate(-7 0)"><path d="M48 212 C38 226 44 236 60 236 H170 C204 236 220 218 220 184 V156 C209 162 193 167 184 175 C177 182 178 188 176 194 C174 201 170 204 164 204 H72 C60 204 54 208 48 212 Z"/><path d="M32 92 C24 98 24 106 24 120 V202 C24 216 30 226 40 232 C34 218 50 204 60 196 V120 C60 108 50 100 42 96 C38 94 34 92 32 92 Z"/><path d="M24 84 C28 68 42 56 60 56 H152 C172 56 184 68 184 84 V92 H92 C72 92 56 78 40 78 C34 78 28 80 24 84 Z"/><path d="M190 86 V62 C190 44 218 36 234 20 V46 C234 64 202 66 190 86 Z"/><path d="M188 122 V102 C188 84 218 78 246 52 V80 C246 98 202 102 188 122 Z"/><path d="M192 160 V142 C192 122 222 116 232 104 V128 C232 144 200 144 192 160 Z"/></g></g></svg><text x="1140" y="1400" text-anchor="middle" font-family="Noto Sans" font-size="13" fill="#555">03 / SPACE + PRAISE</text><text x="75" y="1450" font-family="Noto Sans" font-size="17" fill="#111">A protected shared space, with enclosing contours that open into an outward rhythm.</text><text x="75" y="1482" font-family="Noto Sans" font-size="17" fill="#555">The same structure explores dwelling and collective praise, without an instrument or a monogram.</text><text x="75" y="1514" font-family="Noto Sans" font-size="17" fill="#555">The bands may suggest leaves or growth. The abstract sanctuary reading and fine seams need testing.</text></svg>
